apis:
- name: Imply Polaris API
  description: >-
    REST API for Imply Polaris, the managed Apache Druid DBaaS. Manage tables,
    files, streaming/batch ingestion jobs, SQL and native queries, dashboards,
    data cubes, alerts, collections, API keys, network policies, identity, and
    audit logs. Global resources are org-scoped; regional resources are
    project-scoped under /v1/projects/PROJECT_ID.
