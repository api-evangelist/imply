aid: imply
name: Imply
description: >-
  Imply is the real-time analytics company founded by the original creators of
  Apache Druid. Its flagship product, Imply Polaris, is a fully managed
  database-as-a-service for building real-time analytics applications at scale,
  offering a REST API to manage tables, files, streaming and batch ingestion,
  SQL and native queries, dashboards, alerts, collections, and access control.
  Imply also provides Imply Enterprise and Hybrid for self-managed Apache Druid
  deployments, backed by SOC 2 Type II, ISO 27001, and HIPAA compliance.
